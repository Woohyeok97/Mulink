# BE-1 장애 재현용 nginx 설정.
# api 2대를 upstream에 등록하면 기본 분배 방식이 round-robin(요청마다 번갈아).
# 이 "번갈아"가 핵심 — 발급 요청과 교환 요청이 서로 다른 서버로 갈라진다.
events {}

http {
  upstream api_pool {
    server api1:4000;
    server api2:4000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api_pool;
    }
  }
}
