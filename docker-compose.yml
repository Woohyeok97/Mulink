services:
  api:
    # EC2에서는 이 주소로 이미지를 pull 받는다 (내 맥이 GHCR에 push → EC2가 pull).
    # 로컬에서는 아래 build로 직접 굽는다: docker compose up --build
    image: ghcr.io/woohyeok97/mulink-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - apps/api/.env
    # NODE_ENV는 여기서 고정하지 않는다.
    # 로컬은 실행 시 지정(예: NODE_ENV=development), EC2는 .env의 NODE_ENV=production이 먹는다.
    # 여기서 development로 박아두면 실서버에서도 dev-login이 열리는 사고가 난다.
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  # 세션코드 저장소 (BE-1: 프로세스 메모리 Map에서 이전)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
