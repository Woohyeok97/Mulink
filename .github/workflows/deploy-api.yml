# CD: main에 백엔드(apps/api) 변경이 머지되면 자동으로 배포한다.
# 지금까지 수동으로 하던 "amd64 빌드 → GHCR push → EC2에서 compose pull & up"을 그대로 자동화.
name: Deploy API

on:
  push:
    branches: [main]
    # 백엔드/도커 관련이 바뀔 때만 배포 (프론트만 바뀌면 Amplify가 알아서 함)
    paths:
      - 'apps/api/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # amd64 크로스 빌드를 위한 buildx 셋업 (EC2가 x86이라 필요)
      - uses: docker/setup-buildx-action@v3

      # GHCR 로그인 (이미지 push 권한). GHCR_PAT는 레포 Secrets에 등록해둔 새 토큰.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: woohyeok97
          password: ${{ secrets.GHCR_PAT }}

      # amd64 이미지 빌드 + GHCR push (지금 로컬에서 수동으로 하던 buildx 명령)
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/woohyeok97/mulink-api:latest

      # EC2에 ssh 접속해 최신 이미지 pull & 재기동 (지금 수동으로 하던 배포)
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u woohyeok97 --password-stdin
            cd ~
            docker compose pull
            docker compose up -d
            docker image prune -f
